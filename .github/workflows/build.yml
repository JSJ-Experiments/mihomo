name: Custom Alpha Builds

on:
  push:
    branches: [Alpha]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional embedded version (defaults to alpha-<commit>)"
        required: false
        type: string

concurrency:
  group: custom-alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Set version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="alpha-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILDTIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: |
          export SKIP_CONCURRENT_TEST=1
          export SKIP_INTEROP_TEST=1
          go test ./... -tags with_gvisor -count=1

      - name: Refresh embedded CA bundle
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Build Linux binaries
        shell: bash
        run: |
          mkdir -p dist
          ldflags="-extldflags --static -X github.com/metacubex/mihomo/constant.Version=${VERSION} -X github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME} -w -s -buildid="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 \
            go build -v -tags with_gvisor -trimpath -ldflags "$ldflags" -o dist/mihomo-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -v -tags with_gvisor -trimpath -ldflags "$ldflags" -o dist/mihomo-linux-arm64 .
          gzip -9 dist/mihomo-linux-amd64 dist/mihomo-linux-arm64

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29-beta1

      - name: Build Android arm64-v8
        shell: bash
        run: |
          ldflags="-X github.com/metacubex/mihomo/constant.Version=${VERSION} -X github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME} -w -s -buildid="
          CC="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" \
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            go build -v -tags with_gvisor -trimpath -ldflags "$ldflags" -o dist/mihomo-android-arm64-v8 .
          gzip -9 dist/mihomo-android-arm64-v8

      - name: Generate release metadata
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          cd dist
          sha256sum mihomo-*.gz | sort -k2 > checksums.txt
          printf '%s\n' "$VERSION" > version.txt
          VERSION="$VERSION" COMMIT="$commit" python3 - <<'PY'
          import glob, hashlib, json, os

          assets = {}
          for path in sorted(glob.glob("mihomo-*.gz")):
              name = os.path.basename(path)
              target = name.removeprefix("mihomo-").removesuffix(".gz")
              with open(path, "rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              assets[target] = {"name": name, "sha256": digest}

          with open("manifest.json", "w", encoding="utf-8") as stream:
              json.dump({
                  "schema": 1,
                  "channel": "alpha",
                  "version": os.environ["VERSION"],
                  "commit": os.environ["COMMIT"],
                  "release_tag": "Prerelease-Alpha",
                  "assets": assets,
              }, stream, indent=2)
              stream.write("\n")
          PY
          cat checksums.txt
          cat manifest.json

      - name: Replace moving alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="Prerelease-Alpha"
          version="$(cat dist/version.txt)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force
          gh release create "$tag" dist/* \
            --prerelease \
            --title "Custom Mihomo $version" \
            --notes "Automated JSJ-Experiments build from commit $GITHUB_SHA. Includes Linux amd64, Linux arm64, and Android arm64-v8 binaries."
