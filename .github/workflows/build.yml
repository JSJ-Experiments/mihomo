name: Custom Alpha Builds

on:
  push:
    branches: [Alpha]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional embedded version (defaults to alpha-<commit>)"
        required: false
        type: string

concurrency:
  group: custom-alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goamd64: v1
            output: amd64
            test: true
          - goos: linux
            goarch: arm64
            output: arm64
          - goos: android
            goarch: arm64
            output: arm64-v8
            ndk: aarch64-linux-android34

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Set version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="alpha-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILDTIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Set up Android NDK
        if: matrix.goos == 'android'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29-beta1

      - name: Configure Android compiler
        if: matrix.goos == 'android'
        shell: bash
        run: |
          echo "CC=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.ndk }}-clang" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - name: Configure static Linux build
        if: matrix.goos == 'linux'
        run: echo "CGO_ENABLED=0" >> "$GITHUB_ENV"

      - name: Test
        if: matrix.test == true
        shell: bash
        run: |
          export SKIP_CONCURRENT_TEST=1
          export SKIP_INTEROP_TEST=1
          go test ./... -tags with_gvisor -count=1

      - name: Refresh embedded CA bundle
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: |
          ldflags="-X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="
          if [ "${{ matrix.goos }}" = linux ]; then
            ldflags="-extldflags --static ${ldflags}"
          fi
          output="mihomo-${{ matrix.goos }}-${{ matrix.output }}"
          go build -v -tags with_gvisor -trimpath -ldflags "$ldflags" -o "$output" .
          gzip -9 "$output"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-${{ matrix.goos }}-${{ matrix.output }}
          path: mihomo-${{ matrix.goos }}-${{ matrix.output }}.gz
          if-no-files-found: error

  release-alpha:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release metadata
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="alpha-$(git rev-parse --short HEAD)"
          fi
          commit="$(git rev-parse HEAD)"
          cd dist
          sha256sum mihomo-*.gz | sort -k2 > checksums.txt
          printf '%s\n' "$version" > version.txt
          VERSION="$version" COMMIT="$commit" python3 - <<'PY'
          import glob, hashlib, json, os

          assets = {}
          for path in sorted(glob.glob("mihomo-*.gz")):
              name = os.path.basename(path)
              target = name.removeprefix("mihomo-").removesuffix(".gz")
              with open(path, "rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              assets[target] = {"name": name, "sha256": digest}

          with open("manifest.json", "w", encoding="utf-8") as stream:
              json.dump({
                  "schema": 1,
                  "channel": "alpha",
                  "version": os.environ["VERSION"],
                  "commit": os.environ["COMMIT"],
                  "release_tag": "Prerelease-Alpha",
                  "assets": assets,
              }, stream, indent=2)
              stream.write("\n")
          PY
          cat checksums.txt
          cat manifest.json

      - name: Replace moving alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="Prerelease-Alpha"
          version="$(cat dist/version.txt)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force
          gh release create "$tag" dist/* \
            --prerelease \
            --title "Custom Mihomo $version" \
            --notes "Automated JSJ-Experiments build from commit $GITHUB_SHA. Includes Linux amd64, Linux arm64, and Android arm64-v8 binaries."
